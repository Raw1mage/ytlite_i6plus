name: ytlite
services:
  # 1. Invidious Database
  invidious-db:
    image: postgres:14
    container_name: ytlite-postgres
    volumes:
      - /opt/ytlite_v3/postgres_data:/var/lib/postgresql/data
      # Invidious requires specific SQL init scripts from its repo
      - ./refs/invidious/config/sql:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}"
    restart: unless-stopped
    ports:
      - "1216:5432" # Optional: expose for debugging
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kemal -d invidious" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2a. Invidious Companion (required for video playback since 2025.09+)
  invidious-companion:
    image: quay.io/invidious/invidious-companion:latest
    container_name: ytlite-companion
    restart: unless-stopped
    environment:
      # Shared with the engine below; both read the SAME value from .env so the
      # two can never drift apart. Changing one side only breaks engine<->companion
      # auth, and the symptom does not point at the secret (it surfaces as failed
      # API calls). See webbox/.env.example.
      SERVER_SECRET_KEY: "${SERVER_SECRET_KEY:?SERVER_SECRET_KEY is required - copy .env.example to .env}"

  # 2b. Invidious Engine (The Bone)
  invidious:
    image: quay.io/invidious/invidious:2026.08.06-d6e4022
    container_name: ytlite-engine
    restart: unless-stopped
    ports:
      - "1215:3000"
    volumes:
      - ./BUILD/invidious/config.yml:/invidious/config/config.yml
    environment:
      INVIDIOUS_DATABASE_URL: "postgres://kemal:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}@invidious-db:5432/invidious"
      # Overrides invidious_companion_key from the mounted config.yml. Invidious
      # applies INVIDIOUS_<UPPERCASED_TOP_LEVEL_KEY> env vars BEFORE its empty /
      # CHANGE_ME / length checks (config.cr:208-268), so the file can ship with a
      # placeholder while the real value stays out of version control.
      INVIDIOUS_INVIDIOUS_COMPANION_KEY: "${SERVER_SECRET_KEY:?SERVER_SECRET_KEY is required - copy .env.example to .env}"
    depends_on:
      invidious-db:
        condition: service_healthy
      invidious-companion:
        condition: service_started

  # 3. YT Lite Middleware (The Brain & Skin)
  middleware:
    build:
      context: .
      dockerfile: BUILD/middleware/Dockerfile
    container_name: ytlite
    restart: unless-stopped
    ports:
      - "1214:8080" # Web interface
    volumes:
      - ./src/middleware:/app
      - /opt/ytlite_v3/user_db:/app/data
    environment:
      INVIDIOUS_API_URL: http://invidious:3000 # Internal Docker network
      PORT: 8080
    depends_on:
      - invidious
