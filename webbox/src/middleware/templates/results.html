{% extends "base.html" %}
{% block content %}
<div style="padding: 12px 10px; font-size: 16px; color: #eee; border-bottom: 1px solid #333; margin-bottom: 10px;">
    搜尋：<strong>{{ query }}</strong>
    {% if videos|length == 0 %}
    <span style="color:#888; font-size:13px;">（無結果）</span>
    {% endif %}
    <a href="/" style="float:right; color:#3ea6ff; font-size:13px;">回首頁</a>
</div>

<div class="video-grid">
    {% for video in videos %}
    <div class="video-card" data-vid="{{ video.id }}" data-channel="{{ video.channel_id }}">
        <img src="{{ video.thumbnail }}" loading="lazy">
        <div class="info">
            <div class="title">{{ video.title }}</div>
            <div class="uploader">{{ video.uploader }}</div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
