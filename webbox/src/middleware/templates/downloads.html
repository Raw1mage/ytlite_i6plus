{% extends "base.html" %}

{% block content %}
<style>
    .downloads-header {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid #333;
    }

    .downloads-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .download-item {
        background: #1e1e1e;
        border-radius: 8px;
        padding: 15px;
        display: flex;
        align-items: center;
        gap: 15px;
        position: relative;
        overflow: hidden;
    }

    .download-progress-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background: #4caf50;
        transition: width 0.3s ease;
        width: 0%;
    }

    .dl-thumb {
        width: 80px;
        height: 45px;
        background: #000;
        object-fit: cover;
        border-radius: 4px;
        flex-shrink: 0;
    }

    .dl-info {
        flex: 1;
        min-width: 0;
    }

    .dl-title {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 5px;
        font-size: 14px;
    }

    .dl-meta {
        font-size: 12px;
        color: #aaa;
    }

    .dl-status {
        margin-left: auto;
        font-size: 13px;
        font-weight: bold;
        color: #aaa;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .dl-action-btn {
        background: #333;
        border: none;
        color: #fff;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
    }

    .dl-action-btn.delete {
        background: #cc0000;
    }

    .dl-action-btn:hover {
        opacity: 0.9;
    }

    /* Status Colors */
    .status-queued {
        color: #f0ad4e;
    }

    .status-downloading {
        color: #5bc0de;
    }

    .status-converting {
        color: #5bc0de;
    }

    .status-finished {
        color: #5cb85c;
    }

    .status-error {
        color: #d9534f;
    }

    @media (max-width: 600px) {
        .dl-thumb {
            width: 60px;
            height: 34px;
        }
    }
</style>

<div class="downloads-header">
    <h2 style="margin:0;">Downloads</h2>
    <div style="margin-left:auto; display:flex; gap:10px; align-items: center;">
        <button id="btn-set-folder" onclick="setDownloadFolder()"
            style="background:#444; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">📂
            設定下載目錄</button>
        <button onclick="downloadAll(event)"
            style="background:#4caf50; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">全部存檔</button>
        <button onclick="clearFinished(event)"
            style="background:#555; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Clear
            Finished</button>
    </div>
</div>

<div id="downloads-container" class="downloads-list">
    <!-- Populated by JS -->
    <div style="text-align:center; padding:30px; color:#555;">Loading...</div>
</div>

<script>
    let pollInterval = null;
    let currentJobs = [];

    async function getSavedHandle() {
        try {
            const req = indexedDB.open('ytlite_v3_db', 1);
            const db = await new Promise((res) => { req.onsuccess = () => res(req.result); req.onerror = () => res(null); });
            if (!db) return null;
            const tx = db.transaction('settings', 'readonly');
            const store = tx.objectStore('settings');
            return await new Promise((res) => {
                const r = store.get('download_dir');
                r.onsuccess = () => res(r.result);
                r.onerror = () => res(null);
            });
        } catch (e) { return null; }
    }

    async function verifyPermission(handle) {
        if (!handle) return false;
        const opts = { mode: 'readwrite' };
        const current = await handle.queryPermission(opts);
        if (current === 'granted') return true;

        return new Promise((resolve) => {
            showConfirm('授權請求', '為了實現「自動靜默下載」，請在稍後的瀏覽器系統提示中點擊「允許」。', async (yes) => {
                if (yes) {
                    try {
                        const result = await handle.requestPermission(opts);
                        resolve(result === 'granted');
                    } catch (e) {
                        resolve(false);
                    }
                } else {
                    resolve(false);
                }
            });
        });
    }

    async function setDownloadFolder() {
        try {
            if (!window.showDirectoryPicker) {
                return showAlert('提示', '您的瀏覽器不支持直接存取文件夾，請手動下載。');
            }
            const handle = await window.showDirectoryPicker();
            if (await verifyPermission(handle)) {
                window.downloadDirHandle = handle;
                // Save to IDB
                const req = indexedDB.open('ytlite_v3_db', 1);
                req.onsuccess = () => {
                    const db = req.result;
                    const tx = db.transaction('settings', 'readwrite');
                    tx.objectStore('settings').put(handle, 'download_dir');
                };

                const btn = document.getElementById('btn-set-folder');
                if (btn) {
                    btn.innerText = `📁 已選: ${handle.name}`;
                    btn.style.background = '#2ba640';
                }
                showToast('已設定下載目錄');
            }
        } catch (e) {
            console.error(e);
        }
    }

    // Auto-load handle
    (async () => {
        const handle = await getSavedHandle();
        if (handle) {
            window.downloadDirHandle = handle;
            setTimeout(() => {
                const btn = document.getElementById('btn-set-folder');
                if (btn) {
                    btn.innerText = `📁 已選: ${handle.name}`;
                    btn.style.background = '#2ba640';
                }
            }, 500);
        }
    })();

    let activeAutoSaves = new Set();
    async function fetchDownloads() {
        try {
            const res = await fetch('/api/downloads');
            const jobs = await res.json();
            currentJobs = jobs; // Store globally
            renderDownloads(jobs);

            if (window.downloadDirHandle) {
                const readyJobs = jobs.filter(j => (j.status === 'completed' || j.status === 'finished'));
                for (const job of readyJobs) {
                    if (!activeAutoSaves.has(job.job_id)) {
                        autoSaveJob(job);
                    }
                }
            }
        } catch (e) {
            console.error('Fetch downloads error:', e);
        }
    }

    async function autoSaveJob(job) {
        activeAutoSaves.add(job.job_id);
        try {
            const result = await triggerFileDownload(job.job_id, `${job.title}.${job.format}`);
            // DELETE removes the file from disk, so it needs positive evidence of a
            // local copy -- never merely the absence of an error.
            if (result === 'confirmed') {
                // purge=true: a verified local copy exists, so freeing the server copy
                // is the point of auto-save. Only path allowed to destroy bytes.
                await fetch(`/api/downloads/${job.job_id}?purge=true`, { method: 'DELETE' });
                fetchDownloads();
            } else {
                showToast(`⬇️ 已傳送，伺服器副本保留（未能確認本機存檔）`);
            }
        } catch (e) {
            console.error("Auto save failed", e);
        } finally {
            activeAutoSaves.delete(job.job_id);
        }
    }

    function renderDownloads(jobs) {
        const container = document.getElementById('downloads-container');
        if (jobs.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:30px; color:#555;">No active downloads</div>';
            return;
        }

        container.innerHTML = '';
        jobs.forEach(job => {
            const item = document.createElement('div');
            item.className = 'download-item';

            let statusText = job.status.toUpperCase();
            let statusClass = `status-${job.status}`;
            let progress = job.progress || 0;
            let meta = `Format: ${job.format.toUpperCase()} • Type: ${job.type}`;

            if (job.status === 'downloading') {
                meta += ` • ${job.speed || ''} • ETA: ${job.eta || ''}`;
                statusText = `${progress.toFixed(1)}%`;
            } else if (job.status === 'completed' || job.status === 'finished') {
                statusText = 'READY';
                statusClass = 'status-finished';
            } else if (job.status === 'archived') {
                // Found on disk at startup. Visible on purpose, but deliberately NOT
                // matched by readyJobs above: no automatic pipeline may touch it.
                statusText = '已存檔';
                statusClass = 'status-finished';
                progress = 100;
            } else if (job.status === 'error') {
                // Determine if it's 403
                if (job.error && job.error.includes('403')) {
                    meta += ` • <span style="color:#ff6b6b">YouTube Blocked (Try again later)</span>`;
                } else {
                    meta += ` • <span style="color:#ff6b6b">${job.error || 'Check logs'}</span>`;
                }
            }

            // Actions
            let actions = '';
            if (job.status === 'completed' || job.status === 'finished' || job.status === 'archived') {
                // 'archived' shares the save button deliberately: saving is a USER action,
                // and the automatic path (readyJobs -> autoSaveJob) never sees it.
                // job_id ONLY -- deliberately NOT the title. triggerFileDownload's second
                // argument is optional and the function already looks the job up by id, so
                // passing the title bought nothing and cost everything: it crosses an HTML
                // attribute boundary AND a JS string literal, while the old
                // `.replace(/'/g, ...)` escaped exactly one of the characters that matter.
                // 4 of the 60 real ID3 titles on disk contain a double quote, which
                // terminates the attribute outright. A job_id is a uuid -- [0-9a-f-] only.
                actions += `<button class="dl-action-btn" onclick="triggerFileDownload('${job.job_id}')" style="background:#4caf50; margin-right:5px;">Save</button>`;
                if (job.status === 'archived') {
                    // Two separated actions, because one trash button cannot honestly mean
                    // both "stop showing this" and "destroy the bytes". Note this template
                    // previously had NO destructive path for a history file at all (both its
                    // archived branch and its trailing else used deleteJob/purge=false), so
                    // the delete button below introduces that risk here for the first time --
                    // hence the confirmation inside purgeJobFile, not merely a red colour.
                    actions += `<button class="dl-action-btn" onclick="hideArchivedJob('${job.job_id}')" title="只從清單移除，檔案保留" style="margin-right:5px;">隱藏</button>`;
                    actions += `<button class="dl-action-btn delete" onclick="purgeJobFile('${job.job_id}', event)" title="從伺服器刪除檔案（不可復原）">刪除檔案</button>`;
                } else {
                    actions += `<button class="dl-action-btn delete" onclick="deleteJob('${job.job_id}')">Dismiss</button>`;
                }
            } else if (['queued', 'downloading'].includes(job.status)) {
                actions += `<button class="dl-action-btn delete" onclick="cancelJob('${job.job_id}', event)">Cancel</button>`;
            } else {
                actions += `<button class="dl-action-btn delete" onclick="deleteJob('${job.job_id}')">Dismiss</button>`;
            }

            const thumbUrl = `https://i.ytimg.com/vi/${job.video_id}/default.jpg`;

            item.innerHTML = `
                <div class="download-progress-bar" style="width: ${progress}%;"></div>
                <img src="${thumbUrl}" class="dl-thumb" loading="lazy">
                <div class="dl-info">
                    <div class="dl-title">${escapeHtml(job.title)}</div>
                    <div class="dl-meta">${meta}</div>
                </div>
                <div class="dl-status">
                    <span class="${statusClass}">${statusText}</span>
                    ${actions}
                </div>
            `;
            container.appendChild(item);
        });
    }

    async function triggerFileDownload(jobId, suggestedName = '') {
        // Silent download if handle exists
        if (window.downloadDirHandle) {
            try {
                if (!await verifyPermission(window.downloadDirHandle)) {
                    throw new Error('Permission denied');
                }

                const job = currentJobs.find(j => j.job_id === jobId);
                const fileName = suggestedName || (job ? `${job.title}.${job.format}` : `file_${jobId}`);
                const safeName = fileName.replace(/[<>:"/\\|?*!]/g, '_').trim();

                showToast(`正在寫入: ${safeName}...`);

                const response = await fetch(`/api/download_file/${jobId}`);
                if (!response.ok) throw new Error('伺服器回傳錯誤');

                const fileHandle = await window.downloadDirHandle.getFileHandle(safeName, { create: true });
                const writable = await fileHandle.createWritable();

                if (response.body.pipeTo) {
                    await response.body.pipeTo(writable);
                } else {
                    const reader = response.body.getReader();
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        await writable.write(value);
                        await new Promise(r => setTimeout(r, 0)); // Yield to event loop
                    }
                    await writable.close();
                }

                showToast(`✅ 已存檔: ${safeName}`);
                // Only this path actually observed the bytes land on disk.
                return 'confirmed';
            } catch (err) {
                console.error("Silent download error:", err);
                showToast(`自動存檔失敗: ${err.message}，將切換至手動模式。`);
            }
        }

        // Normal fallback. A synthetic anchor click hands the transfer to the browser
        // and gives us no completion callback, so we cannot know whether the file
        // reached the device. Reporting success here would let the caller delete the
        // server's only copy on a guess.
        const url = `/api/download_file/${jobId}`;
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        return 'unknown';
    }

    async function downloadAll(e) {
        // 'archived' IS included here and MUST NOT be included in readyJobs (line ~237).
        // The difference is not the status, it is who initiated: this function runs only
        // from an explicit user click, while readyJobs runs from a 2-second poll. An
        // archived row is a file the server found on disk that the user may never have
        // fetched, so letting the poll touch it is what deleted 73 files in b29dd09.
        // A deliberate click carries the intent that the poll cannot supply.
        const jobs = currentJobs.filter(j => j.status === 'completed' || j.status === 'finished' || j.status === 'archived');
        if (jobs.length === 0) return showAlert('提示', '沒有可下載的項目。', e);

        const useSilent = !!window.downloadDirHandle;
        showToast(useSilent ? '開始批量存檔...' : '開始批量下載...');

        for (const job of jobs) {
            try {
                const result = await triggerFileDownload(job.job_id, `${job.title}.${job.format}`);
                // 'confirmed' is only returned by the path that verified the write.
                if (result === 'confirmed') {
                    // purge=true for the same reason as autoSaveJob: verified local copy.
                    await fetch(`/api/downloads/${job.job_id}?purge=true`, { method: 'DELETE' });
                }
                if (!useSilent) await new Promise(r => setTimeout(r, 1500));
            } catch (e) {
                console.error(e);
            }
        }
        if (useSilent) fetchDownloads();
    }

    async function clearFinished(e) {
        showConfirm('清除確認', '確定要清除所有已完成的任務嗎？（只清列表，檔案保留）', async (yes) => {
            if (!yes) return;
            const jobs = currentJobs.filter(j => j.status === 'completed' || j.status === 'finished' || j.status === 'error');
            showToast('正在清除任務...');
            try {
                // purge=false: clearing the list must never destroy downloads.
                await Promise.all(jobs.map(job => fetch(`/api/downloads/${job.job_id}?purge=false`, { method: 'DELETE' })));
                fetchDownloads();
                showToast('清除完成');
            } catch (e) {
                console.error(e);
                fetchDownloads();
            }
        }, e);
    }

    async function cancelJob(id, e) {
        showConfirm('取消確認', '確定要取消此下載任務嗎？（已下載的部分檔案會被刪除）', async (yes) => {
            if (!yes) return;
            // purge=true: an in-flight job leaves a useless partial file; cancelling
            // it should take the fragment with it.
            await fetch(`/api/downloads/${id}?purge=true`, { method: 'DELETE' });
            fetchDownloads();
        }, e);
    }

    async function deleteJob(id) {
        // purge=false: this is a list operation.
        await fetch(`/api/downloads/${id}?purge=false`, { method: 'DELETE' });
        fetchDownloads();
    }

    async function hideArchivedJob(id) {
        // Wrapper around deleteJob for ARCHIVED rows only. The toast states a property that
        // holds ONLY for archived jobs: the row is rebuilt from disk on the next rescan, so
        // it WILL come back. deleteJob is shared with the completed/finished rows (three
        // call sites in this template), which do NOT come back -- putting this toast inside
        // deleteJob would assert something false for them.
        await deleteJob(id);
        showToast('已隱藏，檔案保留在伺服器（重新啟動後會再出現）');
    }

    async function purgeJobFile(id, e) {
        // The ONLY user-facing path in this template that destroys server bytes for an
        // archived file. The fetch lives INSIDE the confirmation callback on purpose:
        // that is what makes this call site unreachable except by one real click plus
        // one real confirmation. No filter, poll or bulk action can arrive here -- the
        // property the 2026-08-09 incident violated (73 files, ~4.3GB) when a purge=true
        // consumer was fed jobs it should never have seen. Hoisting this fetch out of
        // the callback would destroy that guarantee.
        showConfirm('刪除檔案', '確定要從伺服器刪除這個檔案嗎？此動作不可復原。（若只想從清單移除，請改用「隱藏」）', async (yes) => {
            if (!yes) return;
            await fetch(`/api/downloads/${id}?purge=true`, { method: 'DELETE' });
            showToast('已從伺服器刪除檔案');
            fetchDownloads();
        }, e);
    }

    // Determine poll rate based on visibility
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            clearInterval(pollInterval);
        } else {
            fetchDownloads();
            pollInterval = setInterval(fetchDownloads, 2000);
        }
    });

    // Start
    fetchDownloads();
    pollInterval = setInterval(fetchDownloads, 2000);
</script>
{% endblock %}
