{% extends "base.html" %}

{% block content %}
{% if logged_in %}
<!-- Video Feed -->
<div id="video-grid" class="video-grid">
    <!-- Videos injected via JS -->
</div>
<div id="feed-error" style="display: none; margin: 10px; padding: 14px; background: #3a1e1e; border: 1px solid #7a3535; border-radius: 6px; color: #ffb3b3; font-size: 14px; line-height: 1.6;">
</div>
<div id="feed-empty" style="display: none; text-align: center; padding: 30px; color: #888; font-size: 14px;">
    目前沒有影片。
</div>
<div id="loading" style="text-align: center; padding: 30px; color: #666; display: none;">
    Loading more videos...
</div>
<div id="load-more-container" style="text-align: center; padding: 20px; display: none;">
    <button onclick="loadVideos()"
        style="padding: 10px 20px; background: #333; color: #fff; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500;">載入更多</button>
</div>

<script>
    let nextPageToken = '';
    let isLoading = false;
    let currentCategory = 'all';
    let isFinished = false;

    // Upstream failure and 'genuinely no videos' must render DIFFERENTLY.
    function showFeedError(msg) {
        const box = document.getElementById('feed-error');
        const empty = document.getElementById('feed-empty');
        if (empty) empty.style.display = 'none';
        if (!box) return;
        box.innerHTML = '<strong style="color:#ff6b6b;">無法載入影片</strong><br>'
            + msg
            + '<br><span style="color:#c99; font-size:12px;">這不是「沒有影片」——上游服務目前無法回應，請稍後再試。</span>';
        box.style.display = 'block';
    }

    function showFeedEmpty() {
        const box = document.getElementById('feed-error');
        const empty = document.getElementById('feed-empty');
        if (box) box.style.display = 'none';
        if (empty) empty.style.display = 'block';
    }

    function clearFeedNotices() {
        const box = document.getElementById('feed-error');
        const empty = document.getElementById('feed-empty');
        if (box) box.style.display = 'none';
        if (empty) empty.style.display = 'none';
    }

    async function loadVideos(reset = false) {
        if (isLoading || (isFinished && !reset)) return;
        isLoading = true;
        document.getElementById('loading').style.display = 'block';
        document.getElementById('load-more-container').style.display = 'none';

        if (reset) {
            document.getElementById('video-grid').innerHTML = '';
            clearFeedNotices();
            nextPageToken = '';
            isFinished = false;
        }

        try {
            let data;
            if (currentCategory === 'history') {
                if (reset) {
                    const history = getHistory(); // Defined in base.html
                    data = { videos: history, nextPageToken: '' };
                } else {
                    data = { videos: [], nextPageToken: '' };
                }
            } else {
                const response = await fetch(`/api/videos?pageToken=${nextPageToken}&category=${currentCategory}`);
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                data = await response.json();
                console.log('[loadVideos] category:', currentCategory, 'items:', (data && data.videos ? data.videos.length : 0), 'next:', (data ? data.nextPageToken : ''), 'error:', (data ? data.error : ''));
            }

            // Upstream failure must NOT look like 'no more videos'.
            if (data && data.error) {
                isFinished = true;
                showFeedError(data.error);
                return;
            }

            if (data.videos && data.videos.length > 0) {
                const grid = document.getElementById('video-grid');
                data.videos.forEach(video => {
                    const div = document.createElement('div');
                    div.className = 'video-card';
                    if (video.channel_id) div.setAttribute('data-channel', video.channel_id);
                    div.setAttribute('data-vid', video.id);

                    div.innerHTML = `
                            <img src="${video.thumbnail}" loading="lazy">
                            <div class="info">
                                <div class="title">${video.title}</div>
                                <div class="uploader">${video.uploader}</div>
                            </div>
                        `;
                    grid.appendChild(div);
                });
                nextPageToken = data.nextPageToken || '';
                if (!nextPageToken) isFinished = true;
            } else {
                isFinished = true;
                if (document.getElementById('video-grid').children.length === 0) {
                    showFeedEmpty();
                }
            }
        } catch (e) {
            console.error("Load error:", e);
            isFinished = true;
            showFeedError('無法連線到伺服器（' + e + '）');
        } finally {
            isLoading = false;
            document.getElementById('loading').style.display = 'none';
            if (!isFinished) {
                document.getElementById('load-more-container').style.display = 'block';
            }
        }
    }

    async function loadCategoryInternal(cat, element, refresh = false) {
        if (typeof closeOverlayIfOpen === 'function') closeOverlayIfOpen();

        if (element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            if (!refresh) {
                element.classList.add('active');
            } else {
                const active = document.querySelector(`.chip[onclick*="'${currentCategory}'"]`);
                if (active) active.classList.add('active');
            }
        }

        if (!refresh && cat === currentCategory) return;

        currentCategory = cat;
        await loadVideos(true);
    }

    // Expose for base.html to call
    window.loadCategoryInternal = loadCategoryInternal;

    window.onload = function () {
        const urlParams = new URLSearchParams(window.location.search);
        const vid = urlParams.get('v');
        if (vid) {
            const dummyVideo = { id: vid, title: '', uploader: '', thumbnail: '' };
            if (typeof openPlayer === 'function') openPlayer(dummyVideo);
        }
        loadVideos(true);
    };

    // Infinite Scroll Logic
    window.onscroll = function () {
        // Use a larger buffer (e.g., 800px) to trigger earlier
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
            loadVideos();
        }
    };
</script>

{% else %}
<div style="text-align: center; margin-top: 50px;">
    <h2 style="color: #aaa;">Search YouTube</h2>
    <form action="/search" method="get" class="search-box">
        <input type="search" name="q" placeholder="What do you want to watch?" required inputmode="search"
            enterkeyhint="search">
        <button type="submit">Go</button>
    </form>
    <div style="margin-top: 30px; font-size: 0.8em; color: #555;">Running on iPhone 6 Plus (iOS 12)</div>
</div>
{% endif %}
{% endblock %}
